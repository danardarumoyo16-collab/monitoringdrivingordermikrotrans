<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring DO Mikrotrans</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide-fade {
            transition: opacity 0.8s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen w-screen overflow-hidden flex items-center justify-center">

    <!-- CONTAINER UTAMA SPLIT SCREEN (PAS 100% LAYAR, TANPA SCROLLBAR) -->
    <div class="w-full h-screen grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
        
        <!-- ==================== SISI KIRI: FORM LOGIN (60% / 7 KOLOM) ==================== -->
        <div class="lg:col-span-7 flex flex-col justify-between items-center p-6 sm:p-10 lg:p-12 bg-slate-950 border-r border-slate-900 z-20 h-full overflow-y-auto no-scrollbar">
            
            <!-- FLEX SPACER ATAS AGAR KANDUNGAN BERADA TEPAT DI TENGAH -->
            <div class="w-full flex-1 flex flex-col items-center justify-center">
                
                <!-- CARD CONTAINER FORM LOGIN -->
                <div class="w-full max-w-md bg-slate-900/40 border border-slate-800/60 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
                    
                    <!-- ICON BINTANG 8 SISI -->
                    <div class="flex flex-col items-center justify-center mb-5 text-center">
                        <div class="mb-2 text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 stroke-[2.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2v20"></path>
                                <path d="M2 12h20"></path>
                                <path d="m4.93 4.93 14.14 14.14"></path>
                                <path d="m4.93 19.07 14.14-14.14"></path>
                            </svg>
                        </div>
                        
                        <h1 class="text-xl font-extrabold text-white tracking-tight">Selamat Datang!</h1>
                    </div>

                    <!-- FORM INPUT LOGIN -->
                    <form action="index.html" method="GET" class="flex flex-col gap-4">
                        
                        <!-- Input Email / NIP -->
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-slate-300">
                                Email / NIP Petugas <span class="text-red-500">*</span>
                            </label>
                            <input 
                                type="text" 
                                name="username" 
                                required
                                placeholder="ari.sutanto@transjakarta.co.id"
                                class="w-full bg-slate-950/80 border border-slate-800/80 focus:border-blue-500 rounded-xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none transition shadow-inner font-medium"
                            >
                        </div>

                        <!-- Input Password -->
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-slate-300">
                                Password <span class="text-red-500">*</span>
                            </label>
                            <div class="relative flex items-center">
                                <input 
                                    type="password" 
                                    id="passwordInput"
                                    name="password" 
                                    required
                                    placeholder="••••••••"
                                    class="w-full bg-slate-950/80 border border-slate-800/80 focus:border-blue-500 rounded-xl pl-4 pr-11 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none transition shadow-inner font-medium"
                                >
                                <!-- Tombol Show/Hide Password -->
                                <button 
                                    type="button" 
                                    onclick="togglePasswordVisibility()" 
                                    class="absolute right-3.5 text-slate-400 hover:text-white transition focus:outline-none cursor-pointer"
                                    title="Tampilkan Password"
                                >
                                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 stroke-[2]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Lupa Password Link -->
                        <div class="flex justify-end text-xs">
                            <a href="#" class="text-blue-400 hover:text-blue-300 transition text-[11px] font-semibold">Lupa Password?</a>
                        </div>

                        <!-- Tombol Masuk -->
                        <button 
                            type="submit" 
                            class="mt-1 w-full py-2.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-blue-600/25 transition duration-200 cursor-pointer"
                        >
                            Masuk
                        </button>

                    </form>

                </div>

            </div>

            <!-- FOOTER COPYRIGHT -->
            <div class="text-[11px] font-mono text-slate-600 shrink-0 pb-2">
                © <span id="thn"></span> Mikrotrans DO
            </div>

        </div>

        <!-- ==================== SISI KANAN: CAROUSEL GAMBAR (40% / 5 KOLOM) ==================== -->
        <div class="hidden lg:col-span-5 lg:flex relative bg-slate-950 overflow-hidden h-full">

            <!-- CAROUSEL SLIDES -->
            <div class="w-full h-full relative flex items-center justify-center">
                
                <!-- Slide 1: Naik Mikrotrans -->
                <div class="carousel-slide slide-fade absolute inset-0 w-full h-full opacity-100 flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-[url('Konten/naik.jpeg')] bg-cover bg-center blur-2xl opacity-30"></div>
                    <img src="Konten/naik.jpeg" alt="Naik Mikrotrans" class="relative z-10 max-w-full max-h-full object-contain shadow-2xl">
                </div>

                <!-- Slide 2: Bus Stop -->
                <div class="carousel-slide slide-fade absolute inset-0 w-full h-full opacity-0 pointer-events-none flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-[url('Konten/Bus%20Stop.jpeg')] bg-cover bg-center blur-2xl opacity-30"></div>
                    <img src="Konten/Bus%20Stop.jpeg" alt="Titik Bus Stop Mikrotrans" class="relative z-10 max-w-full max-h-full object-contain shadow-2xl">
                </div>

                <!-- Slide 3: Tap In / Tap Out -->
                <div class="carousel-slide slide-fade absolute inset-0 w-full h-full opacity-0 pointer-events-none flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-[url('Konten/tap.jpeg')] bg-cover bg-center blur-2xl opacity-30"></div>
                    <img src="Konten/tap.jpeg" alt="Pembayaran Tap" class="relative z-10 max-w-full max-h-full object-contain shadow-2xl">
                </div>

                <!-- Slide 4: 98 Layanan Rute -->
                <div class="carousel-slide slide-fade absolute inset-0 w-full h-full opacity-0 pointer-events-none flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-[url('Konten/Rute%2098%20layanan.jpeg')] bg-cover bg-center blur-2xl opacity-30"></div>
                    <img src="Konten/Rute%2098%20layanan.jpeg" alt="Melayani 98 Layanan Rute" class="relative z-10 max-w-full max-h-full object-contain shadow-2xl">
                </div>

                <!-- Slide 5: Pelanggan -->
                <div class="carousel-slide slide-fade absolute inset-0 w-full h-full opacity-0 pointer-events-none flex items-center justify-center p-4">
                    <div class="absolute inset-0 bg-[url('Konten/Pelanggan.jpeg')] bg-cover bg-center blur-2xl opacity-30"></div>
                    <img src="Konten/Pelanggan.jpeg" alt="Pelanggan Mikrotrans" class="relative z-10 max-w-full max-h-full object-contain shadow-2xl">
                </div>

                <!-- OVERLAY GRADASI BAWAH UNTUK DOTS -->
                <div class="absolute inset-x-0 bottom-0 h-24 bg-gradient-to-t from-slate-950/90 to-transparent z-10 pointer-events-none"></div>

                <!-- DOTS INDIKATOR FLOATING DI BAWAH -->
                <div class="absolute bottom-6 inset-x-0 z-20 flex justify-center items-center gap-2">
                    <button onclick="goToSlide(0)" class="dot-item w-8 h-2 rounded-full bg-blue-500 transition-all cursor-pointer shadow-md"></button>
                    <button onclick="goToSlide(1)" class="dot-item w-2 h-2 rounded-full bg-white/40 backdrop-blur-md transition-all cursor-pointer shadow-md"></button>
                    <button onclick="goToSlide(2)" class="dot-item w-2 h-2 rounded-full bg-white/40 backdrop-blur-md transition-all cursor-pointer shadow-md"></button>
                    <button onclick="goToSlide(3)" class="dot-item w-2 h-2 rounded-full bg-white/40 backdrop-blur-md transition-all cursor-pointer shadow-md"></button>
                    <button onclick="goToSlide(4)" class="dot-item w-2 h-2 rounded-full bg-white/40 backdrop-blur-md transition-all cursor-pointer shadow-md"></button>
                </div>

            </div>

        </div>

    </div>

    <!-- SCRIPT CAROUSEL & PASSWORD TOGGLE -->
    <script>
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const dots = document.querySelectorAll('.dot-item');
        const totalSlides = slides.length;
        let autoSlideInterval;

        function showSlide(index) {
            slides.forEach((slide, idx) => {
                if (idx === index) {
                    slide.classList.remove('opacity-0', 'pointer-events-none');
                    slide.classList.add('opacity-100');
                } else {
                    slide.classList.remove('opacity-100');
                    slide.classList.add('opacity-0', 'pointer-events-none');
                }
            });

            dots.forEach((dot, idx) => {
                if (idx === index) {
                    dot.classList.remove('w-2', 'bg-white/40');
                    dot.classList.add('w-8', 'bg-blue-500');
                } else {
                    dot.classList.remove('w-8', 'bg-blue-500');
                    dot.classList.add('w-2', 'bg-white/40');
                }
            });

            currentSlideIndex = index;
        }

        function goToSlide(index) {
            showSlide(index);
            resetAutoSlide();
        }

        function startAutoSlide() {
            autoSlideInterval = setInterval(() => {
                let nextIndex = (currentSlideIndex + 1) % totalSlides;
                showSlide(nextIndex);
            }, 3500);
        }

        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('thn').textContent = new Date().getFullYear();
            startAutoSlide();
        });
    </script>
</body>
</html>
